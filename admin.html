<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | JALTRON</title>
  <script>try{var t=localStorage.getItem("jt:theme");document.documentElement.dataset.theme=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}catch(e){}</script>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="db.js"></script>
  <style>
    .bot{max-width:60rem;margin:1rem auto;padding:1rem}
    .bot h2{font-size:1rem;margin:0 0 .75rem}
    .bot-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.75rem}
    .bot-bar .sp{flex:1}
    .pill{padding:.2rem .65rem;border-radius:99px;font-size:.7rem;font-weight:700;text-transform:uppercase;background:#6b7280;color:#fff}
    .pill.running{background:#16a34a}.pill.crashed{background:#dc2626}.pill.stopped{background:#6b7280}
    .btn[disabled]{opacity:.45;pointer-events:none}
    .bot-log{height:18rem;overflow:auto;margin:0;padding:.6rem .75rem;border-radius:.6rem;background:#05070f;color:#cfd8ff;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
    .bot-log .err{color:#ff7b7b}.bot-log .sys{color:#22e5ff}
  </style>
</head>
<body>
  <main class="adm hud">
    <h1>JALTRON Admin</h1>
    <p class="sub" id="a-state">Loading...</p>
    <button class="btn primary" id="a-login" hidden>Sign in with Google</button>
    <div id="a-tool" hidden>
      <form class="cmd-form" id="a-form"><input id="a-q" placeholder="Username, account ID, or the message the person sent" autocomplete="off" required><button class="btn primary">Find</button></form>
      <div id="a-user" hidden>
        <p><strong id="a-name"></strong> <code id="a-uid"></code></p>
        <p class="sub" id="a-plan"></p>
        <div class="adm-btns">
          <button class="btn primary" data-days="30">Give Lite: 30 days</button>
          <button class="btn" data-days="90">90 days</button>
          <button class="btn" data-days="-1">Forever</button>
          <button class="btn" data-days="0">Remove (Free)</button>
        </div>
      </div>
    </div>
  </main>
  <main class="hud bot" id="bot-tool" hidden>
    <h2>Bot control</h2>
    <div class="bot-bar">
      <span class="pill" id="b-pill">PC offline</span><span class="sub" id="b-info"></span><span class="sp"></span>
      <button class="btn primary" id="b-start" disabled>Start</button>
      <button class="btn" id="b-restart" disabled>Restart</button>
      <button class="btn danger" id="b-stop" disabled>Stop</button>
    </div>
    <pre class="bot-log" id="b-log"></pre>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let cur = null;
    const show = (m) => { $('a-state').textContent = m; };
    const plan = (p) => !p || p.p !== 'lite' ? 'Free' : p.e ? (p.e > Date.now() ? 'Lite until ' + new Date(p.e).toLocaleString() : 'Lite (expired)') : 'Lite forever';
    addEventListener('jaltron:user', async (e) => {
      if (!e.detail.user) { show('Sign in with an admin account.'); $('a-login').hidden = false; $('a-tool').hidden = true; return; }
      $('a-login').hidden = true;
      let ok = false; try { ok = await DB.isAdmin(); } catch {}
      $('a-tool').hidden = !ok; botInit(ok); show(ok ? 'Signed in as ' + e.detail.user.email : 'This account is not an admin.');
    });
    $('a-login').onclick = () => DB.signIn();
    async function find(q) {
      try { cur = await DB.adminFind(q); } catch { return show('Lookup failed.'); }
      $('a-user').hidden = false; $('a-name').textContent = cur.name || '(no username)'; $('a-uid').textContent = cur.uid; $('a-plan').textContent = 'Plan: ' + plan(cur.plan);
    }
    // People paste "Hi! I want to get JALTRON Lite. My account ID: <id>": the ID is picked out for you
    $('a-form').onsubmit = (e) => { e.preventDefault(); const q = $('a-q').value, m = q.match(/account ID:\s*([A-Za-z0-9]{20,40})/i) || q.match(/\b([A-Za-z0-9]{20,40})\b/); find(m ? m[1] : q.trim()); };
    document.querySelectorAll('[data-days]').forEach(b => b.onclick = async () => {
      if (!cur) return;
      try { await DB.adminSet(cur.uid, Number(b.dataset.days)); show('Done.'); find(cur.uid); } catch { show('Could not save. Is this account in the admins collection?'); }
    });

    // Bot control: agent.js on the bot machine reads the command you send here through Firestore
    let botOn = false, botDoc = null;
    function botPaint() {
      const d = botDoc, up = !!d && Date.now() - Number(d.hb || 0) < 150000, run = up && d.s === 'running';
      $('b-pill').className = 'pill ' + (up ? d.s : ''); $('b-pill').textContent = up ? d.s : 'PC offline';
      $('b-info').textContent = run ? 'pid ' + d.pid + ' · up ' + Math.floor((Date.now() - Number(d.st)) / 60000) + ' min' : '';
      $('b-start').disabled = !up || run; $('b-stop').disabled = !run; $('b-restart').disabled = !run;
      const box = $('b-log'), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.textContent = '';
      let rows = []; try { rows = JSON.parse((d && d.l) || '[]'); } catch {}
      for (const [t, kind, m] of rows) { const l = document.createElement('div'); l.className = kind; l.textContent = new Date(t).toLocaleTimeString() + '  ' + m; box.appendChild(l); }
      if (stick) box.scrollTop = box.scrollHeight;
    }
    function botInit(ok) {
      $('bot-tool').hidden = !ok;
      if (!ok || botOn) return; botOn = true;
      DB.bot.watch((d) => { botDoc = d; botPaint(); }); setInterval(botPaint, 30000);
    }
    ['start', 'stop', 'restart'].forEach((c) => $('b-' + c).onclick = () => DB.bot.command(c).catch((e) => alert('Could not send: ' + e.message)));
  </script>
</body>
</html>
