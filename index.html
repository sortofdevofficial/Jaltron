<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JALTRON - AI Plan Manager</title>
  <link id="favicon" rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP HEADER -->
  <header class="hud top">
    <div class="brand">
      <div class="logo-wrapper">
        <img src="favicon.png" alt="JALTRON Logo" width="30" height="30">
      </div>
      <div>
        <h1>JALTRON <span class="tag">PRO</span></h1>
        <p class="sub">AI Task & Context Planner</p>
      </div>
    </div>

    <div class="top-actions">
      <div class="status"><span class="dot"></span><span>SYSTEM ONLINE</span></div>
    </div>
  </header>

  <!-- DASHBOARD STATS -->
  <section class="stats-grid">
    <div class="hud card">
      <div class="card-title"><i class="fa-solid fa-list-check"></i> Total Tasks</div>
      <div class="card-value" id="stat-total">0</div>
    </div>
    <div class="hud card">
      <div class="card-title"><i class="fa-solid fa-spinner"></i> In Progress</div>
      <div class="card-value primary" id="stat-pending">0</div>
    </div>
    <div class="hud card">
      <div class="card-title"><i class="fa-solid fa-check-double"></i> Completed</div>
      <div class="card-value ok" id="stat-done">0</div>
    </div>
    <div class="hud card">
      <div class="card-title"><i class="fa-solid fa-fire"></i> High Priority</div>
      <div class="card-value danger" id="stat-high">0</div>
    </div>
  </section>

  <!-- MAIN CONTENT: PLAN MANAGER -->
  <main class="grid">

    <!-- ADD TASK / AI PARSER -->
    <aside class="hud panel">
      <div class="panel-title">
        <span><i class="fa-solid fa-robot"></i> Quick Add</span>
        <img src="favicon.png" alt="" width="16" height="16" style="opacity: 0.6; filter: drop-shadow(0 0 4px rgba(255,255,255,0.2));">
      </div>
      <form id="task-form">
        <div class="field">
          <label for="task-title">Task Description</label>
          <input type="text" id="task-title" placeholder="e.g., Fix database path error in server.js" required>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="task-prio">Priority</label>
            <select id="task-prio">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="field">
            <label for="task-tag">Category</label>
            <select id="task-tag">
              <option value="Dev">Dev</option>
              <option value="Bug">Bug</option>
              <option value="Study">Study</option>
              <option value="General">General</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn primary full"><i class="fa-solid fa-plus"></i> ADD TO PLAN</button>
      </form>

      <div class="ai-box">
        <div class="ai-head"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Plan Optimizer</div>
        <p class="sub">Re-orders active tasks based on impact & priority score.</p>
        <button class="btn full mt" id="ai-sort-btn"><i class="fa-solid fa-bolt"></i> OPTIMIZE PLAN</button>
      </div>
    </aside>

    <!-- TASK LIST BOARD -->
    <section class="hud panel main-board">
      <div class="panel-title">
        <span><i class="fa-solid fa-layer-group"></i> Active Execution Plan</span>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="done">Completed</button>
        </div>
      </div>

      <div id="task-list" class="task-list">
        <!-- Tasks will render here -->
      </div>
    </section>

  </main>

  <script src="index.js"></script>
</body>
</html>
