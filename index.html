<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JALTRON - AI Plan Manager</title>
  <link id="favicon" rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hud top">
    <div class="brand">
      <div class="logo-wrapper"><img src="favicon.png" alt="JALTRON Logo" width="30" height="30"></div>
      <div>
        <h1>JALTRON</h1>
        <p class="sub">AI Task &amp; Context Planner</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">CONNECTING</span></div>
    </div>
  </header>

  <section class="stats-grid">
    <div class="hud card"><div class="card-title"><i class="fa-solid fa-list-check"></i> Total Tasks</div><div class="card-value" id="stat-total">0</div></div>
    <div class="hud card"><div class="card-title"><i class="fa-solid fa-spinner"></i> In Progress</div><div class="card-value primary" id="stat-pending">0</div></div>
    <div class="hud card"><div class="card-title"><i class="fa-solid fa-check-double"></i> Completed</div><div class="card-value ok" id="stat-done">0</div></div>
    <div class="hud card"><div class="card-title"><i class="fa-solid fa-fire"></i> High Priority</div><div class="card-value danger" id="stat-high">0</div></div>
    <div class="hud card"><div class="card-title"><i class="fa-solid fa-triangle-exclamation"></i> Overdue</div><div class="card-value warn" id="stat-overdue">0</div></div>
  </section>

  <div class="hud progress-wrap">
    <div class="progress-label"><span>Overall progress</span><span id="progress-text">0%</span></div>
    <div class="progress"><div id="progress-bar"></div></div>
  </div>

  <main class="grid">
    <aside class="hud panel">
      <div class="panel-title">
        <span><i class="fa-solid fa-robot"></i> Quick Add</span>
        <img src="favicon.png" alt="" width="16" height="16" style="opacity:.6">
      </div>
      <form id="task-form">
        <div class="field">
          <label for="task-title">Task description</label>
          <input type="text" id="task-title" placeholder="e.g., Fix database path error in server.js" required maxlength="140" autocomplete="off">
        </div>
        <div class="two-col">
          <div class="field">
            <label for="task-prio">Priority</label>
            <select id="task-prio">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="field">
            <label for="task-tag">Category</label>
            <select id="task-tag">
              <option>Dev</option><option>Bug</option><option>Study</option><option>General</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="task-due">Due date (optional)</label>
          <input type="date" id="task-due">
        </div>
        <button type="submit" class="btn primary full"><i class="fa-solid fa-plus"></i> Add to plan</button>
      </form>

      <div class="ai-box">
        <div class="ai-head"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Assistant</div>
        <p class="sub">Say what you want in plain words, like "add task for my study tomorrow".</p>
        <form class="cmd-form" id="cmd-form">
          <input id="cmd-input" placeholder="Tell AI what to do" autocomplete="off" aria-label="Tell AI what to do">
          <button class="btn primary" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
        <button class="btn full mt" id="ai-sort-btn"><i class="fa-solid fa-bolt"></i> Smart sort</button>
      </div>
    </aside>

    <section class="hud panel main-board">
      <div class="panel-title">
        <span><i class="fa-solid fa-layer-group"></i> Active Execution Plan</span>
        <div class="filter-group" id="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="done">Completed</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="search" placeholder="Search tasks  ( / )" aria-label="Search tasks"></div>
        <select id="cat-filter" aria-label="Filter by category">
          <option value="all">All categories</option><option>Dev</option><option>Bug</option><option>Study</option><option>General</option>
        </select>
        <button class="btn" id="clear-done"><i class="fa-solid fa-broom"></i> Clear completed</button>
      </div>

      <div id="task-list" class="task-list"></div>
    </section>
  </main>

  <button class="fab" id="chat-fab" aria-label="Open AI assistant"><i class="fa-solid fa-comment-dots"></i></button>
  <section class="chat" id="chat" aria-label="JALTRON AI assistant" hidden>
    <div class="chat-head"><span><i class="fa-solid fa-wand-magic-sparkles"></i> Ask JALTRON</span><button class="icon-btn sm" id="chat-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="ai-bar">
      </div>
      <span class="sub" id="nn-state">Starting neural AI...</span>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chips" id="chips"><button>Add a study task</button><button>Plan my day</button><button>Summary</button><button>What can you do?</button></div>
    <form class="chat-form" id="chat-form"><input id="chat-input" placeholder="Ask about your plan" autocomplete="off"><button class="btn primary" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="ai.js"></script>
  <script src="index.js"></script>
</body>
</html>
