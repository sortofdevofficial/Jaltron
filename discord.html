<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord | JALTRON</title>
  <meta name="description" content="Live stats, leaderboards, giveaways and verified vouches from our Discord community.">
  <script>try{var t=localStorage.getItem("jt:theme");document.documentElement.dataset.theme=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}catch(e){}</script>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="db.js"></script>
  <style>
    .dc{max-width:66rem;margin:0 auto;padding:1.25rem 1rem 3rem;color:var(--text)}
    .dc h1{margin:0 0 .25rem;font-size:1.6rem}.dc .sub{color:var(--muted);margin:0 0 1rem}
    .dc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.75rem;margin-bottom:1rem}
    .dc-stat{padding:.9rem 1rem;text-align:center}.dc-stat b{display:block;font-size:1.5rem;color:var(--accent)}.dc-stat span{font-size:.75rem;color:var(--muted)}
    .dc-chart{padding:.9rem 1rem;margin-bottom:1rem}.dc-chart h3,.dc-box h3{margin:0 0 .5rem;font-size:.85rem;color:var(--muted)}
    .dc-chart svg{width:100%;height:6rem;display:block}
    .dc-tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
    .dc-tabs button{all:unset;cursor:pointer;padding:.4rem .9rem;border-radius:99px;border:1px solid var(--border);font-size:.8rem;font-weight:600}
    .dc-tabs button.on{background:var(--accent);color:#04101a;border-color:var(--accent)}
    .dc-tabs.sm button{font-size:.74rem;padding:.3rem .7rem}
    .dc-tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
    .dc-tools input,.dc-tools select,.dc-form input,.dc-form select,.dc-form textarea{padding:.5rem .7rem;border-radius:.5rem;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font:inherit;font-size:.82rem;box-sizing:border-box}
    .dc-tools input{flex:1;min-width:9rem}
    .dc-list{display:grid;gap:.5rem}
    .dc-card{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem}
    .dc-card img,.dc-row img,.dc-av{width:2.4rem;height:2.4rem;border-radius:50%;flex:none;background:var(--panel-3)}
    .dc-av{display:grid;place-items:center;font-weight:700;color:var(--accent)}
    .dc-card .tx{min-width:0;flex:1;font-size:.85rem;line-height:1.5}
    .dc-card .tx b{cursor:pointer}.dc-card .tx b:hover{color:var(--accent)}
    .dc-card .it{display:inline-block;margin-top:.15rem;padding:.1rem .55rem;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:600;font-size:.78rem}
    .dc-card .web{font-size:.68rem;margin-left:.35rem;color:var(--muted)}
    .dc-card q{display:block;margin-top:.2rem;color:var(--muted);font-size:.8rem}
    .dc-card small,.dc-row small{color:var(--muted);font-size:.72rem}
    .dc-card a{color:var(--accent);font-size:.72rem;text-decoration:none;white-space:nowrap}
    .dc-row{display:flex;align-items:center;gap:.7rem;padding:.55rem .9rem}
    .dc-row img{width:2rem;height:2rem}
    .dc-row .bar{flex:1;height:.45rem;border-radius:99px;background:var(--panel-3);overflow:hidden}.dc-row .bar i{display:block;height:100%;background:var(--accent)}
    .dc-row .nm{width:9rem;font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dc-row .n{font-weight:700;min-width:2.5rem;text-align:right;font-size:.82rem}.dc-row .rk{width:2.2rem;color:var(--muted);font-size:.78rem}
    .dc-chips{display:flex;flex-wrap:wrap;gap:.4rem}
    .dc-chips button{all:unset;cursor:pointer;padding:.3rem .7rem;border-radius:99px;border:1px solid var(--border);font-size:.8rem}
    .dc-chips button:hover{border-color:var(--accent)}.dc-chips b{color:var(--accent);margin-left:.3rem}
    .dc-box{padding:.9rem 1rem;margin-bottom:.75rem}.dc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:.75rem}
    .dc-scroll{max-height:30rem;overflow:auto}
    .dc-pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin:.75rem 0;font-size:.8rem;color:var(--muted)}
    .dc-pager div{display:flex;gap:.4rem;align-items:center}
    .dc-empty{padding:1.5rem;text-align:center;color:var(--muted)}
    .dc-form{display:grid;gap:.5rem;margin-top:.5rem}.dc-form textarea{min-height:3.5rem;resize:vertical}
    .dc-msg{font-size:.8rem;margin:.25rem 0 0}.dc-msg.bad{color:#ef4444}.dc-msg.ok{color:#16a34a}
    .dc-gw{padding:.8rem 1rem}.dc-gw b{font-size:.95rem}.dc-gw div{font-size:.78rem;color:var(--muted);margin-top:.2rem}
    @media(max-width:36rem){.dc-row .nm{width:6rem}}
  </style>
</head>
<body>
<main class="dc">
  <h1>💬 Discord</h1>
  <p class="sub" id="sub">Loading...</p>
  <div class="dc-tabs" id="tabs">
    <button data-t="overview" class="on">Overview</button><button data-t="vouches">Vouches</button><button data-t="boards">Leaderboards</button><button data-t="giveaways">Giveaways</button>
  </div>

  <!-- Overview -->
  <section id="p-overview"><div class="dc-stats" id="ov"></div></section>

  <!-- Vouches -->
  <section id="p-vouches" hidden>
    <div class="dc-stats" id="stats"></div>
    <section class="hud dc-box" id="add">
      <h3>Add your vouch</h3>
      <div id="vf-out"><p class="sub" style="margin:0 0 .5rem">Sign in with Google to add a vouch. It is posted in our Discord and shows up here too.</p><button class="btn primary" id="vf-login">Sign in with Google</button></div>
      <div id="vf-in" hidden>
        <div class="dc-form">
          <select id="vf-who"></select>
          <input id="vf-item" maxlength="80" placeholder="What did you get? (e.g. Nitro)" autocomplete="off">
          <textarea id="vf-note" maxlength="200" placeholder="Optional comment"></textarea>
          <button class="btn primary" id="vf-go">Post my vouch</button>
        </div>
        <p class="dc-msg" id="vf-msg"></p>
      </div>
    </section>
    <section class="hud dc-chart"><h3>Vouches per day (last 30 days)</h3><svg id="chart" viewBox="0 0 300 60" preserveAspectRatio="none"></svg></section>
    <div class="dc-tabs sm" id="subtabs"><button data-s="wall" class="on">All vouches</button><button data-s="top">Top vouched</button><button data-s="items">Items</button></div>
    <div id="s-wall">
      <div class="dc-tools">
        <input id="q" placeholder="Search item" autocomplete="off">
        <input id="who" list="names" placeholder="Pick a person" autocomplete="off">
        <select id="role"><option value="any">Gave or got</option><option value="got">Got vouches</option><option value="gave">Gave vouches</option></select>
        <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select>
        <select id="size"><option>10</option><option selected>25</option><option>50</option><option>100</option><option>500</option><option value="0">All</option></select>
        <button class="btn" id="csv" title="Download the vouches matching your filters">Export CSV</button>
      </div>
      <datalist id="names"></datalist>
      <div class="dc-pager"><span id="count"></span><div><button class="btn" id="prev">‹ Prev</button><span id="pg"></span><button class="btn" id="next">Next ›</button></div></div>
      <div class="dc-list" id="wall"></div>
    </div>
    <div id="s-top" hidden><div class="dc-list" id="top"></div></div>
    <div id="s-items" hidden><div class="hud dc-box"><div class="dc-chips" id="items"></div></div></div>
  </section>

  <!-- Leaderboards -->
  <section id="p-boards" hidden><div class="dc-grid" id="boards"></div></section>
  <!-- Giveaways -->
  <section id="p-giveaways" hidden><div class="dc-grid" id="gws"></div></section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString();
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const clear = (e) => { e.textContent = ''; return e; };
  let M = {}, V = [], U = {}, C = null, page = 0, view = [], me = null, unwatch = null;

  // Everything comes through /api/pub (cached by Vercel), never straight from Firestore.
  const get = (name) => fetch('/api/pub?name=' + name).then((r) => r.ok ? r.json() : null).catch(() => null);

  // Chunks (oldest first) -> one list. V rows: { i: message id, a: giver id, r: receiver id, w: item, t: time, c: comment }
  function expand(D) {
    const rows = [], users = {};
    for (const ch of D.chunks || []) {
      for (const [id, u] of Object.entries(ch.u || {})) users[id] = u; // later chunks are newer, so the newest name wins
      for (const [i, a, r, w, t, c] of ch.r || []) rows.push({ i, a, r, w: (ch.i || [])[w] || '', t, c: c || '' });
    }
    return { rows, users };
  }
  const name = (id) => (U[id] && U[id][0]) || 'Unknown';
  const isWeb = (id) => String(id).startsWith('w:');
  function avatar(id) {
    const v = U[id] && U[id][1];
    if (isWeb(id)) return el('div', 'dc-av', name(id).slice(0, 1).toUpperCase());
    const i = el('img'); i.loading = 'lazy'; i.alt = '';
    i.src = v ? `https://cdn.discordapp.com/avatars/${id}/${v}.png?size=64` : `https://cdn.discordapp.com/embed/avatars/${Number((BigInt(id) >> 22n) % 6n)}.png`;
    return i;
  }
  const ago = (ms) => { const s = Math.max(1, (Date.now() - ms) / 1000); for (const [n, l] of [[31536000, 'y'], [2592000, 'mo'], [86400, 'd'], [3600, 'h'], [60, 'm']]) if (s >= n) return Math.floor(s / n) + l + ' ago'; return 'just now'; };
  const dur = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${fmt(h)}h ${m}m` : `${m}m`; };
  const tally = (key) => { const m = new Map(); V.forEach((v) => { const k = key(v); m.set(k, (m.get(k) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1]); };
  const stat = (box, v, l) => { const c = el('div', 'hud dc-stat'); c.appendChild(el('b', '', v)); c.appendChild(el('span', '', l)); box.appendChild(c); };

  // ── Overview: server stats from the bot ──
  function paintOverview() {
    const box = clear($('ov')), s = (C && C.stats) || {};
    if (!C || !C.stats) { box.appendChild(el('div', 'hud dc-empty', 'Server stats are not available yet.')); return; }
    stat(box, fmt(s.members), 'Members');
    stat(box, fmt(s.boosts) + (s.tier ? ` (L${s.tier})` : ''), 'Server boosts');
    if (s.youtube != null) stat(box, fmt(s.youtube), 'YouTube subscribers');
    stat(box, fmt(s.messages), 'Messages counted');
    stat(box, fmt(Math.floor((s.voiceSec || 0) / 3600)) + 'h', 'Voice time');
    stat(box, fmt(V.length), 'Vouches');
    stat(box, fmt(((C.giveaways && C.giveaways.active) || []).length), 'Active giveaways');
    if (s.counting != null) stat(box, fmt(s.counting), 'Counting channel');
    stat(box, fmt(s.warns), 'Active warns');
    stat(box, fmt(s.tickets), 'Open tickets');
    stat(box, dur((s.uptime || 0) / 1000), 'Bot uptime');
    stat(box, (s.ping || 0) + ' ms', 'Bot ping');
    if (s.created) stat(box, new Date(s.created).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }), 'Server created');
    $('sub').textContent = C.updatedAt ? 'Live from our Discord bot · updated ' + ago(C.updatedAt) : 'Live from our Discord bot';
  }

  // ── Vouches ──
  function paintVouchStats() {
    const cut = Date.now() - 30 * 864e5, box = clear($('stats'));
    stat(box, fmt(V.length), 'Total vouches'); stat(box, fmt(new Set(V.map((v) => v.a)).size), 'Different people vouched');
    stat(box, fmt(V.filter((v) => v.t >= cut).length), 'Last 30 days'); stat(box, V.length ? new Date(V[0].t).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '-', 'Vouching since');
    const days = [...Array(30)].map((_, i) => new Date(Date.now() - (29 - i) * 864e5).toISOString().slice(0, 10)), per = {};
    V.forEach((v) => { if (v.t >= cut - 864e5) { const k = new Date(v.t).toISOString().slice(0, 10); per[k] = (per[k] || 0) + 1; } });
    const vals = days.map((k) => per[k] || 0), max = Math.max(1, ...vals);
    $('chart').innerHTML = vals.map((v, i) => `<rect x="${i * 10 + 1}" y="${58 - (v / max) * 56}" width="8" height="${(v / max) * 56 + 1}" rx="2" fill="var(--accent)"><title>${days[i]}: ${v}</title></rect>`).join('');
  }
  function filtered() {
    const q = $('q').value.trim().toLowerCase(), p = $('who').value.trim().toLowerCase(), role = $('role').value;
    let rows = V.filter((v) => {
      if (q && !(v.w + ' ' + v.c).toLowerCase().includes(q)) return false;
      if (!p) return true;
      const a = name(v.a).toLowerCase().includes(p), r = name(v.r).toLowerCase().includes(p);
      return role === 'got' ? r : role === 'gave' ? a : a || r;
    });
    if ($('sort').value === 'new') rows = [...rows].reverse();
    return rows;
  }
  function pick(id, role) { $('who').value = name(id); $('role').value = role; page = 0; show('vouches'); sub('wall'); paintWall(); }
  function paintWall() {
    view = filtered();
    const size = Number($('size').value) || view.length || 1, pages = Math.max(1, Math.ceil(view.length / size));
    page = Math.min(page, pages - 1);
    const from = page * size, rows = view.slice(from, from + size), box = clear($('wall'));
    $('count').textContent = view.length ? `Showing ${fmt(from + 1)}-${fmt(from + rows.length)} of ${fmt(view.length)}` : 'No vouches match';
    $('pg').textContent = `${page + 1} / ${pages}`; $('prev').disabled = page === 0; $('next').disabled = page >= pages - 1;
    if (!rows.length) box.appendChild(el('div', 'hud dc-empty', 'No vouches match your filters.'));
    rows.forEach((v) => {
      const c = el('div', 'hud dc-card'), tx = el('div', 'tx');
      c.appendChild(avatar(v.a));
      const by = el('b', '', name(v.a)); by.onclick = () => pick(v.a, 'gave');
      const to = el('b', '', name(v.r)); to.onclick = () => pick(v.r, 'got');
      tx.appendChild(by); if (isWeb(v.a)) tx.appendChild(el('span', 'web', '🌐 website'));
      tx.appendChild(document.createTextNode(' vouched for ')); tx.appendChild(to);
      tx.appendChild(document.createElement('br')); tx.appendChild(el('span', 'it', v.w || 'Not specified'));
      if (v.c) tx.appendChild(el('q', '', v.c));
      tx.appendChild(el('small', '', new Date(v.t).toLocaleString() + ' · ' + ago(v.t)));
      c.appendChild(tx);
      if (M.gid) { const a = el('a', '', 'Proof ↗'); a.href = `https://discord.com/channels/${M.gid}/${M.ch}/${v.i}`; a.target = '_blank'; a.rel = 'noopener'; a.title = 'Open the original message in Discord (members only)'; c.appendChild(a); }
      box.appendChild(c);
    });
  }
  function exportCsv() {
    const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    const csv = ['date,from,to,item,comment,discord_message_id', ...view.map((v) => [new Date(v.t).toISOString(), q(name(v.a)), q(name(v.r)), q(v.w), q(v.c), v.i].join(','))].join('\n');
    const a = el('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'vouches.csv'; a.click(); URL.revokeObjectURL(a.href);
  }
  function paintTopList() {
    const box = clear($('top')), rows = tally((v) => v.r).slice(0, 100), max = (rows[0] && rows[0][1]) || 1;
    rows.forEach(([id, c], i) => {
      const r = el('div', 'hud dc-row'); r.appendChild(el('b', 'rk', '#' + (i + 1))); r.appendChild(avatar(id)); r.appendChild(el('span', 'nm', name(id)));
      const bar = el('div', 'bar'), fill = el('i'); fill.style.width = (c / max * 100) + '%'; bar.appendChild(fill); r.appendChild(bar); r.appendChild(el('span', 'n', fmt(c)));
      r.style.cursor = 'pointer'; r.onclick = () => pick(id, 'got'); box.appendChild(r);
    });
  }
  function paintItems() {
    const box = clear($('items')), m = new Map();
    V.forEach((v) => { const k = (v.w || 'Not specified').toLowerCase(), e = m.get(k) || { n: v.w || 'Not specified', c: 0 }; e.c++; m.set(k, e); });
    [...m.values()].sort((a, b) => b.c - a.c).slice(0, 200).forEach((e) => {
      const b = el('button', '', e.n); b.appendChild(el('b', '', e.c));
      b.onclick = () => { $('q').value = e.n; $('who').value = ''; page = 0; show('vouches'); sub('wall'); paintWall(); }; box.appendChild(b);
    });
  }
  function fillNames() {
    const dl = clear($('names')), seen = new Set();
    tally((v) => v.r).concat(tally((v) => v.a)).forEach(([id]) => { const n = name(id); if (seen.has(n) || seen.size > 3000) return; seen.add(n); const o = el('option'); o.value = n; dl.appendChild(o); });
    const sel = clear($('vf-who'));
    const first = el('option', '', 'Who are you vouching for?'); first.value = ''; sel.appendChild(first);
    tally((v) => v.r).slice(0, 50).forEach(([id, c]) => { const o = el('option', '', `${name(id)} (${c} vouches)`); o.value = id; sel.appendChild(o); });
  }

  // ── Add a vouch from the website (the bot posts it in Discord) ──
  const say = (t, bad) => { const m = $('vf-msg'); m.textContent = t; m.className = 'dc-msg ' + (bad ? 'bad' : 'ok'); };
  function paintForm() { $('vf-in').hidden = !me; $('vf-out').hidden = !!me; }
  function watchMine() {
    if (unwatch) { unwatch(); unwatch = null; }
    if (!me || !window.DB) return;
    unwatch = DB.vouch.watch((d) => {
      if (!d) return;
      if (!d.done) say('⏳ Sent. Waiting for the bot to post it in Discord…');
      else if (d.st === 'posted') say('✅ Your last vouch is posted in Discord. It appears in the list below within a few minutes.');
      else if (d.st === 'rejected') say('❌ ' + (d.er || 'That vouch was rejected.'), true);
    });
  }
  addEventListener('jaltron:user', (e) => {
    const d = e.detail || {};
    me = d.user ? { name: (d.profile && d.profile.n) || d.user.displayName || 'Member' } : null;
    paintForm(); watchMine();
  });
  $('vf-login').onclick = () => window.DB && DB.signIn();
  $('vf-go').onclick = async () => {
    const r = $('vf-who').value, w = $('vf-item').value.trim(), c = $('vf-note').value.trim();
    if (!r || !w) return say('Pick a person and write what you got.', true);
    $('vf-go').disabled = true;
    try { await DB.vouch.send(r, w.slice(0, 80), c.slice(0, 200), me.name.slice(0, 32)); say('⏳ Sent. The bot posts it in Discord within about a minute.'); $('vf-item').value = ''; $('vf-note').value = ''; }
    catch (e) { say(e.code === 'permission-denied' ? 'You can add one vouch per hour, and your Google email must be verified.' : 'Could not send: ' + e.message, true); }
    $('vf-go').disabled = false;
  };

  // ── Leaderboards and giveaways (from the bot) ──
  function paintBoards() {
    const box = clear($('boards'));
    if (!C || !C.leaderboard) { box.appendChild(el('div', 'hud dc-empty', 'Leaderboards are not available yet.')); return; }
    const nm = (x) => (x.user && x.user.username) || 'Unknown';
    const board = (title, rows) => {
      const b = el('div', 'hud dc-box'); b.appendChild(el('h3', '', title));
      const sc = el('div', 'dc-scroll'); b.appendChild(sc);
      if (!rows.length) sc.appendChild(el('div', 'dc-empty', 'Nothing yet.'));
      rows.forEach(([n, val, img], i) => { const r = el('div', 'dc-row'); r.appendChild(el('span', 'rk', '#' + (i + 1))); if (img) { const im = el('img'); im.src = img; im.loading = 'lazy'; im.alt = ''; r.appendChild(im); } r.appendChild(el('span', 'nm', n)); r.appendChild(el('span', 'n', val)); sc.appendChild(r); });
      box.appendChild(b);
    };
    board('💬 Top chatters', (C.leaderboard.messages || []).map((x) => [nm(x), 'Lv ' + x.level + ' · ' + fmt(x.messages), x.user && x.user.avatar]));
    board('🎙️ Voice time', (C.leaderboard.voice || []).map((x) => [nm(x), dur(x.seconds), x.user && x.user.avatar]));
    board('📨 Top inviters', (C.invites || []).map((x) => [nm(x), fmt(x.total), x.user && x.user.avatar]));
  }
  function paintGiveaways() {
    const box = clear($('gws')), gw = (C && C.giveaways) || { active: [], recent: [] };
    const group = (title, rows, live) => {
      const b = el('div', 'dc-box hud'); b.appendChild(el('h3', '', title));
      if (!rows.length) b.appendChild(el('div', 'dc-empty', 'None right now.'));
      rows.forEach((g) => {
        const c = el('div', 'dc-gw'); c.appendChild(el('b', '', '🎉 ' + g.prize));
        c.appendChild(el('div', '', `#${g.gwId} · ${fmt(g.entries)} entries · ${g.winnersCount} winner${g.winnersCount > 1 ? 's' : ''} · host ${(g.host && g.host.t) || 'staff'}`));
        c.appendChild(el('div', '', live ? 'Ends ' + new Date(g.endsAt).toLocaleString() : 'Ended ' + new Date(g.endedAt || g.endsAt).toLocaleString() + ' · winners: ' + (g.winners && g.winners.length ? g.winners.map((w) => w.t).join(', ') : 'none')));
        b.appendChild(c);
      });
      box.appendChild(b);
    };
    group('Active giveaways', gw.active, true); group('Recent giveaways', gw.recent, false);
  }

  function show(t) {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
    ['overview', 'vouches', 'boards', 'giveaways'].forEach((k) => { $('p-' + k).hidden = k !== t; });
  }
  function sub(t) {
    document.querySelectorAll('#subtabs button').forEach((b) => b.classList.toggle('on', b.dataset.s === t));
    ['wall', 'top', 'items'].forEach((k) => { $('s-' + k).hidden = k !== t; });
  }
  document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => show(b.dataset.t));
  document.querySelectorAll('#subtabs button').forEach((b) => b.onclick = () => sub(b.dataset.s));
  ['q', 'who'].forEach((id) => $(id).addEventListener('input', () => { page = 0; paintWall(); }));
  ['role', 'sort', 'size'].forEach((id) => $(id).addEventListener('change', () => { page = 0; paintWall(); }));
  $('prev').onclick = () => { page--; paintWall(); $('wall').scrollIntoView({ block: 'start' }); };
  $('next').onclick = () => { page++; paintWall(); $('wall').scrollIntoView({ block: 'start' }); };
  $('csv').onclick = exportCsv;

  (async () => {
    let D; [D, C] = await Promise.all([get('legit'), get('community')]);
    if (D && D.chunks) { M = D; ({ rows: V, users: U } = expand(D)); }
    $('sub').textContent = C ? '' : 'Live data is not available right now. Please try again later.';
    paintOverview(); paintVouchStats(); fillNames(); paintWall(); paintTopList(); paintItems(); paintBoards(); paintGiveaways(); paintForm();
  })();
})();
</script>
